# Rate limiting zone for public analytics ingestion: 30r/s with burst of 100
limit_req_zone $binary_remote_addr zone=nya_analytics_limit:10m rate=30r/s;

# HTTP/80: redirect all HTTP to HTTPS except health check and ACME challenge
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name notyouraverage.xyz www.notyouraverage.xyz;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS/443: secure reverse proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notyouraverage.xyz www.notyouraverage.xyz;

    ssl_certificate /etc/letsencrypt/live/notyouraverage.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notyouraverage.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Health check
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Analytics session ingestion (POST only: /analytics/session/start, /analytics/session/heartbeat)
    location ^~ /analytics/session/ {
        limit_except POST {
            deny all;
        }
        limit_req zone=nya_analytics_limit burst=100 nodelay;
        limit_req_status 429;

        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # Block all other /analytics/ endpoints (no public read/export/realtime)
    location ^~ /analytics/ {
        return 404;
    }

    # Analytics view counter ingestion (POST only: /api/analytics/track)
    location = /api/analytics/track {
        limit_except POST {
            deny all;
        }
        limit_req zone=nya_analytics_limit burst=100 nodelay;
        limit_req_status 429;

        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:8788/track;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # Block all other /api/analytics/ endpoints
    location ^~ /api/analytics/ {
        return 404;
    }

    # Static brand icons
    location = /favicon.ico {
        alias /opt/nya-quick-launch/public/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /favicon.svg {
        alias /opt/nya-quick-launch/public/favicon.svg;
        access_log off;
        log_not_found off;
    }

    # Deny hidden dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Frontend reverse proxy (Next.js / Vinext)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
